services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      RECUR_API_KEYS: sk_test_local:mrc_local
      RECUR_EMBEDDED_SCHEDULER: "true"
      RECUR_TICK_INTERVAL_MS: "10000"
    depends_on:
      postgres:
        condition: service_healthy

  # Not wired up yet - the storage adapter is the v0.2 milestone. It is here so
  # that the issue to build it has somewhere to point.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: recur
      POSTGRES_USER: recur
      POSTGRES_DB: recur
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recur"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - recur-pgdata:/var/lib/postgresql/data

volumes:
  recur-pgdata:
